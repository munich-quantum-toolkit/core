[build-system]
requires = [
  "nanobind~=3.0.0",
  "scikit-build-core>=1.0.3",
  "vcs-versioning>=2.3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "mqt-core"
description = "The Backbone of the Munich Quantum Toolkit"
readme = "README.md"
authors = [
    { name = "Lukas Burgholzer", email = "burgholzer@me.com" }
]
keywords = ["MQT", "quantum-computing", "design-automation", "decision-diagrams"]
license = "MIT"
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "nanobind-backend>=1.0",
]

[project.optional-dependencies]
pennylane = [
  "pennylane>=0.45.1,<0.46",
]
qiskit = [
  "qiskit[qasm3-import]>=1.1.0",
]

[project.entry-points."pennylane.plugins"]
"mqt.ddsim.default" = "mqt.core.plugins.pennylane:DDSIMDevice"

[project.scripts]
mqt-core-cli = "mqt.core.__main__:main"

[project.urls]
Homepage = "https://github.com/munich-quantum-toolkit/core"
Changelog = "https://github.com/munich-quantum-toolkit/core/blob/main/CHANGELOG.md"
Documentation = "https://mqt.readthedocs.io/projects/core"
Issues = "https://github.com/munich-quantum-toolkit/core/issues"
Discussions = "https://github.com/munich-quantum-toolkit/core/discussions"
PyPI = "https://pypi.org/project/mqt-core/"


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Set the wheel install directory
wheel.install-dir = "mqt/core"

# Explicitly set the package directory
wheel.packages = ["python/mqt"]

# Build one split-mode Stable ABI wheel for GIL-enabled CPython 3.11+
wheel.py-api = "cp311"

# Set required Ninja version
ninja.version = ">=1.10"

# CMake 4.4 detects free-threaded Python and supplies Py_GIL_DISABLED on Windows
cmake.version = ">=4.4.1"

# Setuptools-style build caching in a local directory
build-dir = "build/python/{build_type}"

# All the targets to build
build.targets = ["mqt-core-wheel"]

install.components = [
  "mqt-core_Runtime",
  "mqt-core_Development",
  "mqt-core_Python",
  "qdmi_Development",
]

sdist.include = ["python/mqt/core/_version.py"]
sdist.exclude = [
    "**/.github",
    "**/doc",
    "**/docs",
    "**/meta",
    "**/paper",
    "**/plots",
    "**/test",
    "**/tests",
]

[[tool.dynamic-metadata]]
provider = "vcs_versioning"


[tool.check-sdist]
sdist-only = ["python/mqt/core/_version.py"]
git-only = [
    "docs/*",
    "test/*",
    "mlir/*",
]

[tool.scikit-build.cmake.define]
BUILD_MQT_CORE_BINDINGS = "ON"
BUILD_MQT_CORE_TESTS = "OFF"
BUILD_MQT_CORE_SHARED_LIBS = "ON"
CMAKE_UNITY_BUILD = "ON"

[[tool.scikit-build.overrides]]
if.python-version = ">=3.15"
if.abi-flags = "t"
wheel.py-api = "cp315t"

[tool.vcs-versioning]
write_to = "python/mqt/core/_version.py"


[tool.check-wheel-contents]
ignore = [
  "W002", # Wheel contains duplicate files (.so symlinks)
  "W004", # Module is not located at importable path (/lib/mqt-core-*.so)
]


[tool.pytest]
minversion = "9.0"
strict = true
addopts = [
  "-ra",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
filterwarnings = [
  "error",
  'ignore:\s.*Pyarrow.*:DeprecationWarning:',
  'ignore:.*datetime\.datetime\.utcfromtimestamp.*:DeprecationWarning:',
  # Autograd 1.8 uses control flow that Python 3.14 reports while compiling the module.
  "ignore:'return' in a 'finally' block:SyntaxWarning",
  # Qiskit 1.2 deprecations
  'ignore:.*no need for these schema-conformant objects.*:DeprecationWarning:',
  # Qiskit 1.3 deprecations
  'ignore:.*``qiskit.dagcircuit.dagcircuit.DAGCircuit.*`` is deprecated as of qiskit 1.3.0.*:DeprecationWarning:',
  'ignore:.*``qiskit.circuit.library.standard_gates.x.*`` is pending deprecation as of qiskit 1.3.*:PendingDeprecationWarning:',
  'ignore:.*``qiskit.circuit.instruction.Instruction.condition`` is deprecated as of qiskit 1.3.0.*:DeprecationWarning:',
]
log_level = "INFO"
testpaths = ["test/python"]


[tool.coverage]
run.source = ["mqt.core"]
run.core = "sysmon"
run.parallel = true
run.disable_warnings = [
  "no-sysmon",
]
report.exclude_also = [
  '\.\.\.',
  'if TYPE_CHECKING:',
  'raise AssertionError',
  'raise NotImplementedError',
  'def __dir__()',  # Ignore __dir__ method that exists mainly for better IDE support
  '@overload'  # Overloads are only for static typing
]


[tool.ruff]
line-length = 120
namespace-packages = ["mqt"]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true
src = ["python"]

[tool.ruff.per-file-target-version]
"scripts/qiskit_c_api_adopt.py" = "py314"

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C90",     # <...> too complex
    "COM812",  # Conflicts with formatter
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert detected
    "S404",    # `subprocess` module is possibly insecure
    "TID252"   # Prefer absolute imports over relative imports from parent modules
]
future-annotations = true

[tool.ruff.lint.isort]
known-first-party = ["mqt.core"]

[tool.ruff.lint.per-file-ignores]
"test/python/**" = ["T20", "INP001"]
"test/slurm/**" = ["DOC201", "DOC501", "INP001"]
"docs/**" = ["T20", "INP001"]
"noxfile.py" = ["T20", "TID251", "PLC0415"]
"mlir/unittests/**/*.py" = ["INP001", "T201"]
"*.pyi" = ["D301", "D418", "E501", "PYI021", "PYI011"]
"*.ipynb" = [
    "D",    # pydocstyle
    "E402", # Allow imports to appear anywhere in Jupyter notebooks
    "I002", # Allow missing `from __future__ import annotations` import
]
"python/mqt/core/__main__.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.typos]
default.extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",  # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # ignore block
  "FoMaC"
]

[tool.typos.default.extend-words]
wille = "wille"
anc = "anc"
braket = "braket"
mch = "mch"
ket = "ket"
optin = "optin"
nd = "nd"
olt = "olt"


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.cibuildwheel]
build = "cp3*"
skip = ["*-musllinux_*", "cp314t-*"]
archs = "auto64"
test-groups = ["test"]
test-sources = [
  "test/python",
  "test/circuits",
  "json",
  "scripts/qiskit_c_api_adopt.py",
  "vendor/qiskit-c-api/2.5.0",
]
test-command = "pytest test/python"
build-frontend = "uv"

[[tool.cibuildwheel.overrides]]
select = ["cp*-win_arm64", "cp315*"]
before-test = ""
test-groups = []
test-sources = []
test-command = "python -c \"import mqt.core.dd, mqt.core.ir, mqt.core.mlir, mqt.core.qdmi\""

[tool.cibuildwheel.linux]
before-all = """
uv tool install sccache>=0.10.0
curl -LsSf https://github.com/munich-quantum-software/setup-mlir/releases/download/v1.4.2/setup-mlir.sh | bash -s -- -v 22.1.8 -p /opt/llvm-22.1.8
"""
before-test = "uvx sccache --show-stats"
environment = { DEPLOY = "ON", PATH="$PATH:/root/.local/bin", MLIR_DIR="/opt/llvm-22.1.8/lib/cmake/mlir" }
# QIR-Runner's Linux wheels require a newer glibc than the manylinux_2_28
# containers used to build and test MQT Core's broadly compatible wheels.
test-groups = ["test-base"]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg mqt --ignore-existing"
# cibuildwheel 4.2 passes expanded dependency groups through cmd.exe, which interprets version
# operators as redirections. Let uv resolve the group itself.
test-groups = []
before-test = "uv pip install --group test"

[tool.uv]
required-version = ">=0.5.20"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "bindings/**/*.cpp"},
]

[tool.uv.sources]
mqt-core = { workspace = true }


[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true

[tool.ty.src]
exclude = [
    "docs/**",
    "mlir/**",
]


[dependency-groups]
build = [
  "cmake>=4.4.1",
  "nanobind~=3.0.0",
  "scikit-build-core>=1.0.3",
  "vcs-versioning>=2.3.0",
]
cpp-lint = [
  "cpp-linter==1.13.0",
  "nanobind~=3.0.0",
]
docs = [
  "furo>=2025.09.25",
  "myst-nb>=1.3.0",
  "sphinx-autoapi>=3.6.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "sphinx-llm>=0.4.1",
  "sphinxcontrib-bibtex>=2.6.5",
  "sphinxext-opengraph>=0.13.0",
  "qiskit[visualization]>=1.1.0",
  "openqasm-pygments>=0.2.0",
  "pennylane>=0.45.1,<0.46",
  "qirrunner~=0.9.6",
  "graphviz>=0.21.0",
  "sphinx>=9.0",
  "mlir-pygments>=1.0.0",
]
test-base = [
  "pytest>=9.0.1",
  "pytest-console-scripts>=1.4.1",
  "pytest-cov>=7.1.0",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8.0",
  "pennylane>=0.45.1,<0.46",
  "qiskit[qasm3-import]>=1.1.0",
  "numpy>=2.1; python_version >= '3.13'",
  "numpy>=2.3.2; python_version >= '3.14'",
]
test = [
  {include-group = "test-base"},
  "qirrunner~=0.9.6",
]
dev = [
  {include-group = "build"},
  {include-group = "test"},
  "lit>=18.1.8",
  "nox>=2025.11.12"
]
