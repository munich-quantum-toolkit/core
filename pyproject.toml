[build-system]
build-backend = "scikit_build_core.build"
requires = [
  "nanobind~=3.0.1",
  "scikit-build-core>=1.0.3",
  "vcs-versioning>=2.3",
]


[project]
name = "mqt-core"
description = "The Backbone of the Munich Quantum Toolkit"
readme = "README.md"
keywords = [
  "compilation",
  "decision-diagrams",
  "design-automation",
  "HPCQC",
  "MLIR",
  "MQT",
  "OpenQASM",
  "QDMI",
  "QIR",
  "Qiskit",
  "quantum-computing",
]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "nanobind-backend>=1",
]

[[project.authors]]
name = "Lukas Burgholzer"
email = "burgholzer@me.com"

[[project.authors]]
name = "Daniel Haag"
email = "daniel@mq.sc"

[[project.authors]]
name = "Simon Hofmann"
email = "simon@mq.sc"

[[project.authors]]
name = "Yannick Stade"
email = "yannick.stade@tum.de"

[[project.authors]]
name = "Damian Rovara"
email = "damian.rovara@tum.de"

[[project.authors]]
name = "Matthias Reumann"
email = "matthias.reumann@tum.de"

[[project.authors]]
name = "Patrick Hopf"
email = "patrick.hopf@tum.de"

[[project.authors]]
name = "Marcel Walter"
email = "marcel@mq.sc"

[project.optional-dependencies]
pennylane = [
  "pennylane>=0.45.1,<0.46",
]
qiskit = [
  "qiskit[qasm3-import]>=2.1",
]

[project.urls]
Homepage = "https://github.com/munich-quantum-toolkit/core"
Changelog = "https://github.com/munich-quantum-toolkit/core/blob/main/CHANGELOG.md"
Documentation = "https://mqt.readthedocs.io/projects/core"
Issues = "https://github.com/munich-quantum-toolkit/core/issues"
Discussions = "https://github.com/munich-quantum-toolkit/core/discussions"
PyPI = "https://pypi.org/project/mqt-core/"

[project.scripts]
mqt-core-bench = "mqt.core._bench:main"
mqt-core-cli = "mqt.core.__main__:main"

[project.entry-points."pennylane.plugins"]
"mqt.ddsim.default" = "mqt.core.plugins.pennylane:DDSIMDevice"


[dependency-groups]
dev = [
  { include-group = "build" },
  { include-group = "test" },
  "nox>=2025.11.12",
]
test = [
  { include-group = "test-base" },
  "qirrunner~=0.9.6",
]
docs = [
  "furo>=2025.12.19",
  "mlir-pygments>=1",
  "myst-nb>=1.4",
  "ninja>=1.13",
  "openqasm-pygments>=0.2",
  "pennylane>=0.45.1,<0.46",
  "qiskit[visualization]>=2.1",
  "sphinx>=9",
  "sphinx-autoapi>=3.6.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=1",
  "sphinxcontrib-bibtex>=2.7",
  "sphinxext-opengraph>=0.13",
]
build = [
  "cmake>=4.4.1",
  "nanobind~=3.0.1",
  "scikit-build-core>=1.0.3",
  "vcs-versioning>=2.3",
]
cpp-lint = [
  "cpp-linter==1.13",
  "nanobind~=3.0.1",
]
test-base = [
  "numpy>=2.1; python_version>='3.13'",
  "numpy>=2.3.2; python_version>='3.14'",
  "pennylane>=0.45.1,<0.46",
  "pytest>=9.0.1",
  "pytest-console-scripts>=1.4.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
  "qiskit[qasm3-import]>=2.1",
]


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
# Setuptools-style build caching in a local directory
build-dir = "build/python/{build_type}"

[tool.scikit-build.build]

# All the targets to build
targets = [ "mqt-core-wheel" ]

[tool.scikit-build.cmake]

# CMake 4.4 detects free-threaded Python and supplies Py_GIL_DISABLED on Windows
version = ">=4.4.1"

[tool.scikit-build.cmake.define]
BUILD_MQT_CORE_BINDINGS = "ON"
BUILD_MQT_CORE_TESTS = "OFF"
BUILD_MQT_CORE_SHARED_LIBS = "ON"
CMAKE_UNITY_BUILD = "ON"

[tool.scikit-build.ninja]

# Set required Ninja version
version = ">=1.10"

[tool.scikit-build.sdist]

include = [ "python/mqt/core/_version.py", "test/release/**" ]
exclude = [
  "**/.github",
  "**/doc",
  "**/docs",
  "**/meta",
  "**/paper",
  "**/plots",
  "**/test",
  "**/tests",
]

[tool.scikit-build.wheel]

# Set the wheel install directory
install-dir = "mqt/core"

# Explicitly set the package directory
packages = [ "python/mqt" ]

# Build one split-mode Stable ABI wheel for GIL-enabled CPython 3.11+
py-api = "cp311"

[tool.scikit-build.install]

components = [
  "mqt-core_Runtime",
  "mqt-core_Development",
  "mqt-core_Python",
  "qdmi_Development",
]

[[tool.scikit-build.overrides]]
if.python-version = ">=3.15"
if.abi-flags = "t"
wheel.py-api = "cp315t"


[tool.uv]
required-version = ">=0.5.20"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "bindings/**/*.cpp" },
]

[tool.uv.sources]
mqt-core = { workspace = true }


[tool.cibuildwheel]
build = "cp3*"
skip = [ "*-musllinux_*", "cp314t-*" ]
archs = "auto64"
build-frontend = "uv"
config-settings = { "cmake.define.ENABLE_IPO" = "ON" }
test-command = "pytest test/python"
test-groups = [ "test" ]
test-sources = [
  "bindings/mlir/qiskit/SupportedVersions.inc",
  "json",
  "scripts/check_docs_links.py",
  "scripts/qiskit_c_api_adopt.py",
  "scripts/prepare_release.py",
  "test/circuits",
  "test/python",
  "test/slurm/run_integration.py",
  "vendor/qiskit-c-api/2.5.0",
]

[tool.cibuildwheel.linux]
config-settings = { "cmake.define.CMAKE_PROJECT_INCLUDE_BEFORE" = "{project}/build/release-pgo.cmake", "install.strip" = "false" }
environment = { DEPLOY = "ON", PATH = "/opt/clang/bin:/opt/llvm-23.1.1/bin:$PATH:/root/.local/bin", MLIR_DIR = "/opt/llvm-23.1.1/lib/cmake/mlir", CC = "/opt/clang/bin/clang", CXX = "/opt/clang/bin/clang++", AR = "/opt/clang/bin/llvm-ar", RANLIB = "/opt/clang/bin/llvm-ranlib", LLVM_PROFDATA = "/opt/mqt-release/profiling/tools/bin/llvm-profdata", CMAKE_BUILD_PARALLEL_LEVEL = "4" }
environment-pass = [
  "CMAKE_C_COMPILER_LAUNCHER",
  "CMAKE_CXX_COMPILER_LAUNCHER",
  "SCCACHE_GHA_ENABLED",
  "SCCACHE_GHA_RW_MODE",
  "SCCACHE_IDLE_TIMEOUT",
  "ACTIONS_CACHE_SERVICE_V2",
  "ACTIONS_RESULTS_URL",
  "ACTIONS_RUNTIME_TOKEN",
]
before-all = """
uv run --no-project --python /opt/python/cp311-cp311/bin/python --with cmake==4.4.3 --with ninja==1.13.0 bash "{project}/scripts/provision_release.sh" /opt/mqt-release
"""
before-build = """
uv run --no-project --python "$(command -v python)" --with cmake==4.4.3 --with ninja==1.13.0 --with wheel==0.45.1 --with "nanobind-backend>=1" python "{project}/scripts/prepare_release.py" --project "{project}" --sdk-tools /opt/mqt-release/sdk-tools --llvm-source /opt/mqt-release/llvm-source --source-id "$(cat /opt/mqt-release/llvm-revision)" --lto Full --pgo both --jobs 4
"""
repair-wheel-command = """\
  uv run --no-project --with wheel --with cmake==4.4.3 --with ninja==1.13.0 --python \"$(command -v python)\" python \
  \"{project}/scripts/bolt_wheel.py\" \"{wheel}\" \"{dest_dir}\" \"{project}\"\
  """
before-test = "uvx sccache --show-stats"
# QIR-Runner's Linux wheels require a newer glibc than the manylinux_2_28
# containers used to build and test MQT Core's broadly compatible wheels.
test-groups = [ "test-base" ]
container-engine = "docker; create_args: --cpus=4 --memory=16g --memory-swap=16g"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
config-settings = { "cmake.define.ENABLE_IPO" = "OFF" }
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg mqt --ignore-existing"
before-test = "uv pip install --group test"
# cibuildwheel 4.2 passes expanded dependency groups through cmd.exe, which interprets version
# operators as redirections. Let uv resolve the group itself.
test-groups = []

[[tool.cibuildwheel.overrides]]
select = [ "cp*-win_arm64", "cp315*" ]
before-test = ""
test-command = 'python -c "import mqt.core.dd, mqt.core.mlir, mqt.core.qdmi"'
test-groups = []
test-sources = []


[tool.ruff]
line-length = 120
namespace-packages = [ "mqt" ]
src = [ "python" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"test/python/**" = [ "INP001", "T20" ]
"test/slurm/**" = [ "DOC201", "DOC501", "INP001" ]
"docs/**" = [ "INP001", "T20" ]
"noxfile.py" = [ "PLC0415", "T20", "TID251" ]
"mlir/unittests/**/*.py" = [ "INP001", "T201" ]
"*.pyi" = [ "D301", "D418", "E501", "PYI011", "PYI021" ]
"*.ipynb" = [
  "D",    # pydocstyle
  "E402", # Allow imports to appear anywhere in Jupyter notebooks
  "I002", # Allow missing `from __future__ import annotations` import
]
"python/mqt/core/__main__.py" = [ "T201" ]

[tool.ruff.lint.isort]
known-first-party = [ "mqt.core" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "C90",     # <...> too complex
  "COM812",  # Conflicts with formatter
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S404",    # `subprocess` module is possibly insecure
  "TID252"  # Prefer absolute imports over relative imports from parent modules
]
future-annotations = true

[tool.ruff.per-file-target-version]
"scripts/qiskit_c_api_adopt.py" = "py314"


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.check-sdist]
sdist-only = [ "python/mqt/core/_version.py" ]
git-only = [
  "docs/*",
  "test/*",
  "mlir/*",
]


[tool.check-wheel-contents]
ignore = [
  "W004", # Module is not located at importable path (/lib/mqt-core-*.so)
]


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # ignore block
  "FoMaC"
]

[tool.typos.default.extend-words]
wille = "wille"
anc = "anc"
braket = "braket"
mch = "mch"
ket = "ket"
optin = "optin"
nd = "nd"
olt = "olt"


[tool.ty.src]
exclude = [
  "docs/**",
  "mlir/**",
]

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true


[tool.pytest]
addopts = [
  "-ra",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
filterwarnings = [
  "error",
  # Autograd 1.8 uses control flow that Python 3.14 reports while compiling the module.
  "ignore:'return' in a 'finally' block:SyntaxWarning",
]
log_level = "INFO"
minversion = "9.0"
strict = true
testpaths = [ "test/python" ]


[tool.coverage]

[tool.coverage.run]
source = [ "mqt.core" ]
parallel = true
disable_warnings = [
  "no-sysmon",
]
core = "sysmon"

[tool.coverage.report]
exclude_also = [
  "@overload",                 # Overloads are only for static typing
  '\.\.\.',
  "def __dir__()",             # Ignore __dir__ method that exists mainly for better IDE support
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError"
]


[[tool.dynamic-metadata]]
provider = "vcs_versioning"


[tool.vcs-versioning]
write_to = "python/mqt/core/_version.py"
