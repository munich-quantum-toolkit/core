x-provider-sources: &provider-sources
  - ${MQT_CORE_SLURM_IQM:?Set the IQM checkout}:/iqm:ro
  - ${MQT_CORE_SLURM_BRAKET:?Set the Braket checkout}:/braket:ro

services:
  controller:
    volumes: *provider-sources
    environment:
      - IQM_TOKEN
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_EC2_METADATA_DISABLED=true
  node:
    volumes: *provider-sources
