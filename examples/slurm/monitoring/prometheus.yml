global:
  scrape_interval: 60s
  scrape_timeout: 10s

storage:
  tsdb:
    retention:
      time: 7d
      size: 512MB

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: slurm_jobs
    metrics_path: /metrics/jobs
    static_configs:
      - targets: [controller:6817]
  - job_name: slurm_nodes
    metrics_path: /metrics/nodes
    static_configs:
      - targets: [controller:6817]
  - job_name: slurm_partitions
    metrics_path: /metrics/partitions
    static_configs:
      - targets: [controller:6817]
  - job_name: slurm_scheduler
    metrics_path: /metrics/scheduler
    static_configs:
      - targets: [controller:6817]
