user mqt-dev;
worker_processes 1;
pid /run/nginx.pid;
error_log stderr;

events {
    worker_connections 64;
}

http {
    access_log off;
    proxy_cache_path /run/mqt-slurm-cache keys_zone=accounting:1m max_size=16m inactive=5m;
    proxy_cache accounting;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    proxy_read_timeout 10s;
    proxy_set_header Accept application/json;

    upstream accounting {
        server unix:/run/mqt-slurm-rest.sock;
    }

    server {
        listen 8080;

        # The jobs endpoint also accepts writes; enforce read-only access here.
        if ($request_method != GET) {
            return 405;
        }

        location = /slurmdb/v0.0.44/ping/ {
            proxy_cache off;
            proxy_pass http://accounting;
        }

        location = /slurmdb/v0.0.44/jobs/ {
            if ($arg_start_time !~ "^[0-9]+$") {
                return 400;
            }
            if ($arg_end_time !~ "^[0-9]+$") {
                return 400;
            }
            proxy_pass http://accounting/slurmdb/v0.0.44/jobs/?start_time=$arg_start_time&end_time=$arg_end_time&users=mqt-dev&disable_truncate_usage_time=true;
        }

        location = /slurm/v0.0.44/licenses/ {
            proxy_pass http://accounting;
        }

        location / {
            return 404;
        }
    }
}
