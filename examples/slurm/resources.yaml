# Dynamic QANs join these layers when slurmd registers with the controller.
- resource: mqt.ddsim.default
  mode: MODE_1
  plugin:
    type: hres/lua
    config:
      - name: path
        value: /etc/slurm/hres_qdmi.lua
      - name: probe_timeout
        value: "10"
    maintenance_cycle: 30
    maintenance_timeout: 15
  layers:
    - layer_name: quantum
      count: 2
- resource: mqt.sc.default
  mode: MODE_1
  plugin:
    type: hres/lua
    config:
      - name: path
        value: /etc/slurm/hres_qdmi.lua
      - name: probe_timeout
        value: "10"
    maintenance_cycle: 30
    maintenance_timeout: 15
  layers:
    - layer_name: quantum
      count: 1
