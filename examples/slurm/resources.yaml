# Both QANs can access each device; counts limit concurrent allocations.
- resource: mqt.ddsim.default
  mode: MODE_1
  plugin:
    type: hres/lua
    config:
      - name: path
        value: /etc/slurm/hres_qdmi.lua
    maintenance_cycle: 30
    maintenance_timeout: 15
  layers:
    - layer_name: quantum
      nodes: ["qan[1-2]"]
      count: 2
- resource: mqt.sc.default
  mode: MODE_1
  plugin:
    type: hres/lua
    config:
      - name: path
        value: /etc/slurm/hres_qdmi.lua
    maintenance_cycle: 30
    maintenance_timeout: 15
  layers:
    - layer_name: quantum
      nodes: ["qan[1-2]"]
      count: 1
