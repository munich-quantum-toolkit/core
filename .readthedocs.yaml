version: 2

formats:
  - htmlzip

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    pre_build:
      - python -m pip install uv
    build:
      html:
        # Presentation-branch override: package captures without native builds.
        - python -m uv run --no-project presentations/mqsf2026/build.py --output "$READTHEDOCS_OUTPUT/html"
      htmlzip:
        - mkdir -p "$READTHEDOCS_OUTPUT/htmlzip"
        - cp "$READTHEDOCS_OUTPUT/html/mqsf-2026.zip" "$READTHEDOCS_OUTPUT/htmlzip/html.zip"
