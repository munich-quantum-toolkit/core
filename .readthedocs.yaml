version: 2

formats:
  - htmlzip

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  apt_packages:
    - cmake
    - doxygen
    - zstd
  jobs:
    post_checkout:
      # Skip docs build if the commit message contains "skip ci"
      - (git --no-pager log --pretty="tformat:%s -- %b" -1 | grep -viq "skip ci") || exit 183
      # Unshallow the git clone and fetch tags to get proper version information
      - git fetch --unshallow --tags
    pre_build:
      # Set up uv
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      # Install MLIR
      - |
        setup_mlir_base=https://raw.githubusercontent.com/munich-quantum-software/setup-mlir/5f3c4771ebb8d8e4fe284378b34460f428860a66
        curl -LsSf "$setup_mlir_base/installation/setup-mlir.sh" -o /tmp/setup-mlir.sh
        SETUP_MLIR_MANIFEST_URL="$setup_mlir_base/version-manifest.json" bash /tmp/setup-mlir.sh -v 23.1.2 -p $HOME/mlir
    build:
      html:
        - MLIR_DIR=$HOME/mlir/lib/cmake/mlir uvx nox --non-interactive -s docs
        - mkdir -p $READTHEDOCS_OUTPUT/html && cp -R docs/_build/html/. $READTHEDOCS_OUTPUT/html
      htmlzip:
        - |
          mkdir -p $READTHEDOCS_OUTPUT/htmlzip
          archive=$(realpath $READTHEDOCS_OUTPUT/htmlzip/html.zip)
          (cd docs/_build/html && zip -r $archive .)
