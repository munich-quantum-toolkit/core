name: Environment secret probe with declarations
on:
  workflow_call:
    inputs:
      deployment:
        required: true
        type: boolean
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      ENVIRONMENT_SECRET_PROBE_2603:
        required: false

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    environment:
      name: mqt-app
      deployment: ${{ inputs.deployment }}
    env:
      JOB_APP_ID_PRESENT: ${{ secrets.APP_ID != '' }}
      JOB_APP_PRIVATE_KEY_PRESENT: ${{ secrets.APP_PRIVATE_KEY != '' }}
      JOB_ENVIRONMENT_PROBE_PRESENT: ${{ secrets.ENVIRONMENT_SECRET_PROBE_2603 != '' }}
    steps:
      - name: Check secret availability
        env:
          STEP_APP_ID_PRESENT: ${{ secrets.APP_ID != '' }}
          STEP_APP_PRIVATE_KEY_PRESENT: ${{ secrets.APP_PRIVATE_KEY != '' }}
          STEP_ENVIRONMENT_PROBE_PRESENT: ${{ secrets.ENVIRONMENT_SECRET_PROBE_2603 != '' }}
        run: |
          printf 'Job context: APP_ID=%s APP_PRIVATE_KEY=%s ENVIRONMENT_PROBE=%s\n' "$JOB_APP_ID_PRESENT" "$JOB_APP_PRIVATE_KEY_PRESENT" "$JOB_ENVIRONMENT_PROBE_PRESENT"
          printf 'Step context: APP_ID=%s APP_PRIVATE_KEY=%s ENVIRONMENT_PROBE=%s\n' "$STEP_APP_ID_PRESENT" "$STEP_APP_PRIVATE_KEY_PRESENT" "$STEP_ENVIRONMENT_PROBE_PRESENT"
          test "$STEP_APP_ID_PRESENT" = true
          test "$STEP_APP_PRIVATE_KEY_PRESENT" = true
          test "$STEP_ENVIRONMENT_PROBE_PRESENT" = true
