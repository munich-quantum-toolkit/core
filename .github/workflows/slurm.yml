name: Slurm integration

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/slurm.yml"
      - "bindings/qdmi/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/mqt-core/qdmi/**"
      - "pyproject.toml"
      - "python/mqt/core/_qdmi_discovery.py"
      - "python/mqt/core/qdmi/**"
      - "src/qdmi/**"
      - "examples/slurm/**"
      - "test/slurm/**"
      - "test/qdmi/**"
      - "test/python/qdmi/**"
      - "test/python/test_slurm_*.py"
      - "uv.lock"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/slurm.yml"
      - "bindings/qdmi/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/mqt-core/qdmi/**"
      - "pyproject.toml"
      - "python/mqt/core/_qdmi_discovery.py"
      - "python/mqt/core/qdmi/**"
      - "src/qdmi/**"
      - "examples/slurm/**"
      - "test/slurm/**"
      - "test/qdmi/**"
      - "test/python/qdmi/**"
      - "test/python/test_slurm_*.py"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slurm:
    name: Slurm scheduling and QDMI execution
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out MQT Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Check the Slurm test runner
        run: >-
          uv run --no-project --with 'pytest>=9.0.1' --python 3.15
          pytest -o addopts= -q -m slurm test/python/test_slurm_integration.py

      - name: Test Slurm admission and QDMI execution
        timeout-minutes: 40
        run: uv run --no-project --python 3.15 test/slurm/run_integration.py --nodes 3
