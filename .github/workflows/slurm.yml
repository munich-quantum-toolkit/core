name: Slurm integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/slurm.yml"
      - "bindings/qdmi/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/mqt-core/qdmi/**"
      - "pyproject.toml"
      - "python/mqt/core/_commands.py"
      - "python/mqt/core/qdmi/**"
      - "src/qdmi/**"
      - "examples/slurm/**"
      - "test/slurm/**"
      - "test/qdmi/**"
      - "test/python/qdmi/**"
      - "test/python/test_slurm_integration.py"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/slurm.yml"
      - "bindings/qdmi/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/mqt-core/qdmi/**"
      - "pyproject.toml"
      - "python/mqt/core/_commands.py"
      - "python/mqt/core/qdmi/**"
      - "src/qdmi/**"
      - "examples/slurm/**"
      - "test/slurm/**"
      - "test/qdmi/**"
      - "test/python/qdmi/**"
      - "test/python/test_slurm_integration.py"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slurm:
    name: Slurm scheduling and QDMI execution
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      UV_NO_PROGRESS: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out MQT Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.13.0"
          python-version: "3.15"

      - name: Check the Slurm test runner
        run: >-
          uv run --no-project --with 'pytest>=9.0.1' --python 3.15
          pytest -o addopts= -q test/python/test_slurm_integration.py test/python/test_slurm_availability.py

      - name: Set up MLIR
        uses: munich-quantum-software/setup-mlir@8d3eae73d0f0196fd30c787d91ebd2018cb6c709 # v1.5.0
        with:
          llvm-version: 23.1.2

      - name: Set up compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Build the MQT Core wheel
        timeout-minutes: 15
        run: uv build --wheel --out-dir dist -Ccmake.define.DEPLOY=ON

      - name: Test Slurm admission and QDMI execution
        timeout-minutes: 15
        run: uv run --no-project --python 3.15 test/slurm/run_integration.py --nodes 3
