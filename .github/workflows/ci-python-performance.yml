name: 🧪 Python CI performance
on:
  push:
    branches: ["agent/ci-python-performance"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests-macos:
    if: github.event_name != 'workflow_dispatch'
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@agent/ci-python-performance
    with:
      runs-on: macos-26
      setup-mlir: true
      llvm-version: 22.1.7

  python-tests-windows:
    if: github.event_name != 'workflow_dispatch'
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@agent/ci-python-performance
    with:
      runs-on: windows-2025
      setup-mlir: true
      llvm-version: 22.1.7
