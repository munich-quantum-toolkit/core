name: Environment secret probe without declarations
on:
  workflow_call:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    environment:
      name: mqt-app
      deployment: false
    env:
      JOB_APP_ID_PRESENT: ${{ secrets.APP_ID != '' }}
      JOB_APP_PRIVATE_KEY_PRESENT: ${{ secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Check secret availability
        env:
          STEP_APP_ID_PRESENT: ${{ secrets.APP_ID != '' }}
          STEP_APP_PRIVATE_KEY_PRESENT: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          printf 'Job context: APP_ID=%s APP_PRIVATE_KEY=%s\n' "$JOB_APP_ID_PRESENT" "$JOB_APP_PRIVATE_KEY_PRESENT"
          printf 'Step context: APP_ID=%s APP_PRIVATE_KEY=%s\n' "$STEP_APP_ID_PRESENT" "$STEP_APP_PRIVATE_KEY_PRESENT"
          test "$STEP_APP_ID_PRESENT" = true
          test "$STEP_APP_PRIVATE_KEY_PRESENT" = true
