name: Paired optimization evaluation

on:
  workflow_dispatch:
    inputs:
      wheel-runs:
        description: "Space-separated Core wheel study run IDs"
        type: string
        required: true
      platforms:
        description: "Platform names to evaluate"
        type: string
        default: '["linux-arm64","linux-x64","macos-arm64"]'
      variants:
        description: "Space-separated exact variant names; empty selects all downloaded wheels"
        type: string
        default: ""
  push:
    branches: [codex/linux-optimization-experiments]
    paths: [.github/workflows/optimization-evaluation.yml]

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        cohort: [1, 2]
    runs-on: ${{ matrix.platform == 'macos-arm64' && 'macos-26' || matrix.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          python-version: 3.14.7
          activate-environment: true
          enable-cache: false
      - name: Download selected wheel artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_RUNS: ${{ inputs.wheel-runs }}
          STUDY_PLATFORM: ${{ matrix.platform }}
        run: |
          for run in $WHEEL_RUNS; do
            [[ "$run" =~ ^[0-9]+$ ]] || exit 2
            gh run download "$run" --pattern "study-wheels-$STUDY_PLATFORM-*" --dir "$RUNNER_TEMP/study/downloads"
          done
      - name: Run twelve rotating fresh-process rounds
        shell: bash
        env:
          STUDY_COHORT: ${{ matrix.cohort }}
          STUDY_VARIANTS: ${{ inputs.variants }}
        run: |
          read -r -a variants <<< "$STUDY_VARIANTS"
          python scripts/evaluate_optimization_study.py --downloads "$RUNNER_TEMP/study/downloads" \
            --root "$RUNNER_TEMP/study/cohort" --cohort "$STUDY_COHORT" --variants "${variants[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-evaluation-${{ matrix.platform }}-${{ matrix.cohort }}
          path: |
            ${{ runner.temp }}/study/cohort/evaluation
            ${{ runner.temp }}/study/cohort/measurements
            ${{ runner.temp }}/study/cohort/host.json
            ${{ runner.temp }}/study/cohort/finalists.json
          if-no-files-found: error
