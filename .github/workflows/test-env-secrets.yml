name: Environment secret probe
on:
  pull_request:
    paths:
      - .github/workflows/test-env-secrets*.yml

permissions: {}

jobs:
  direct:
    name: Direct environment access (deployment=${{ matrix.deployment }})
    strategy:
      fail-fast: false
      matrix:
        deployment: [false, true]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    environment:
      name: mqt-app
      deployment: ${{ matrix.deployment }}
    env:
      JOB_APP_ID_PRESENT: ${{ secrets.APP_ID != '' }}
      JOB_APP_PRIVATE_KEY_PRESENT: ${{ secrets.APP_PRIVATE_KEY != '' }}
      JOB_ENVIRONMENT_PROBE_PRESENT: ${{ secrets.ENVIRONMENT_SECRET_PROBE_2603 != '' }}
    steps:
      - name: Check secret availability
        env:
          STEP_APP_ID_PRESENT: ${{ secrets.APP_ID != '' }}
          STEP_APP_PRIVATE_KEY_PRESENT: ${{ secrets.APP_PRIVATE_KEY != '' }}
          STEP_ENVIRONMENT_PROBE_PRESENT: ${{ secrets.ENVIRONMENT_SECRET_PROBE_2603 != '' }}
        run: |
          printf 'Job context: APP_ID=%s APP_PRIVATE_KEY=%s ENVIRONMENT_PROBE=%s\n' "$JOB_APP_ID_PRESENT" "$JOB_APP_PRIVATE_KEY_PRESENT" "$JOB_ENVIRONMENT_PROBE_PRESENT"
          printf 'Step context: APP_ID=%s APP_PRIVATE_KEY=%s ENVIRONMENT_PROBE=%s\n' "$STEP_APP_ID_PRESENT" "$STEP_APP_PRIVATE_KEY_PRESENT" "$STEP_ENVIRONMENT_PROBE_PRESENT"
          test "$STEP_APP_ID_PRESENT" = true
          test "$STEP_APP_PRIVATE_KEY_PRESENT" = true
          test "$STEP_ENVIRONMENT_PROBE_PRESENT" = true

      - name: Authenticate MQT App
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

  declared:
    name: Reusable with declarations (deployment=${{ matrix.deployment }})
    strategy:
      fail-fast: false
      matrix:
        deployment: [false, true]
    uses: $/.github/workflows/test-env-secrets-declared.yml
    with:
      deployment: ${{ matrix.deployment }}

  undeclared:
    name: Reusable without declarations (deployment=${{ matrix.deployment }})
    strategy:
      fail-fast: false
      matrix:
        deployment: [false, true]
    uses: $/.github/workflows/test-env-secrets-undeclared.yml
    with:
      deployment: ${{ matrix.deployment }}
