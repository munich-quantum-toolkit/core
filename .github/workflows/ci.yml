name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      additional-python-files: "mlir/**"

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            compiler: gcc
            preset: debug
          - runs-on: ubuntu-24.04-arm
            compiler: gcc
            preset: release
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      setup-mlir: true
      llvm-version: 22.1.8
      preset-name: ${{ matrix.preset }}

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-26
            compiler: clang
            preset: debug
          - runs-on: macos-26-intel
            compiler: clang
            preset: release
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      setup-mlir: true
      llvm-version: 22.1.8
      preset-name: ${{ matrix.preset }}

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2025
            compiler: msvc
            preset: debug-windows
          - runs-on: windows-11-arm
            compiler: msvc
            preset: release-windows
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      setup-mlir: true
      llvm-version: 22.1.8
      mlir-debug: ${{ matrix.preset == 'debug-windows' }}
      preset-name: ${{ matrix.preset }}

  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-coverage.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      setup-mlir: true
      llvm-version: 22.1.8
    permissions:
      contents: read
      id-token: write

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      clang-version: 22
      build-project: true
      files-changed-only: true
      setup-python: true
      install-pkgs: "nanobind==2.14.0"
      cpp-linter-extra-args: "-std=c++20"
      # Vendored third-party headers are checked upstream and are not maintained
      # according to MQT Core's clang-tidy configuration.
      cpp-linter-ignore-extra: "vendor/**"
      setup-mlir: true
      llvm-version: 22.1.8

  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-26,
            macos-26-intel,
            windows-2025,
          ]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-mlir: true
      llvm-version: 22.1.8

  python-coverage:
    name: 🐍 Coverage
    needs: [change-detection, python-tests]
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    permissions:
      contents: read
      id-token: write

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      check-stubs: true
      enable-ty: true
      enable-mypy: false
      setup-mlir: true
      llvm-version: 22.1.8

  build-sdist:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main

  build-wheel:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-26,
            macos-26-intel,
            windows-2025,
            windows-11-arm,
          ]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@12b5111fd3bbfd5434765e51a8d49182d3e2d8e0 # main
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-mlir: true
      llvm-version: 22.1.8

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-coverage
      - cpp-linter
      - python-tests
      - python-linter
      - build-sdist
      - build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-sdist,build-wheel' || ''
            }}
          jobs: ${{ toJSON(needs) }}
