name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@bd3b7c28d77cacb71d466ff69823e74d1a31d008 # zizmor: ignore[stale-action-refs]
    with:
      additional-test-files: >-
        ["test/circuits/**", "mlir/unittests/Compiler/compile/**", "json/sc/**", "vendor/**/include/**"]
      additional-python-files: >-
        ["bindings/**", "mlir/CMakeLists.txt", "mlir/{bench,include,lib,tools}/**", "vendor/**/{LICENSE,PROVENANCE.json}"]
      additional-docs-files: >-
        ["{CHANGELOG,UPGRADING}.md", ".github/SUPPORT.md", "doxygen/**", "json/sc/**",
         "mlir/CMakeLists.txt", "mlir/{bench,include,lib,tools}/**", "vendor/**/include/**",
         "vendor/catalyst/*/LICENSE", "scripts/{check_docs_links,check_wheel_runtime}.py"]
      additional-cd-files: >-
        [".github/workflows/ci.yml", "**/CMakeLists.txt", "!{test,mlir/unittests}/**/CMakeLists.txt",
         "cmake/**", "pyproject.toml", "scripts/check_wheel_runtime.py", "docs/cpp_api.md"]
    permissions:
      pull-requests: read # List changed paths

  docs:
    name: 📚 Docs
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-docs)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-docs.yml@bd3b7c28d77cacb71d466ff69823e74d1a31d008 # zizmor: ignore[stale-action-refs]
    with:
      apt-packages: doxygen
    permissions:
      actions: read # Shared publisher downloads docs artifacts
      contents: read
      pull-requests: read # Shared publisher verifies preview commits

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-26.04
            compiler: gcc
            preset: debug
            run-on-draft: true
          - runs-on: ubuntu-26.04-arm
            compiler: gcc
            preset: release
            run-on-draft: false
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      preset-name: ${{ matrix.preset }}
      run-on-draft: ${{ matrix.run-on-draft }}
    permissions:
      contents: read

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-26
            compiler: clang
            preset: debug
            run-on-draft: true
          - runs-on: macos-26
            compiler: clang
            preset: release
            run-on-draft: false
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      preset-name: ${{ matrix.preset }}
      run-on-draft: ${{ matrix.run-on-draft }}
    permissions:
      contents: read

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2025
            compiler: msvc
            preset: release
            run-on-draft: true
          - runs-on: windows-11-arm
            compiler: msvc
            preset: release
            run-on-draft: false
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      preset-name: ${{ matrix.preset }}
      run-on-draft: ${{ matrix.run-on-draft }}
    permissions:
      contents: read

  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-coverage.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    permissions:
      contents: read
      id-token: write # Authenticate coverage uploads with Codecov

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      clang-version: 23
      build-project: true
      build-target: mqt-core-lint-headers
      use-sccache-gha: false
      files-changed-only: true
      setup-python: true
      install-pkgs: "nanobind==3.1.0"
      cpp-linter-extra-args: "-std=c++20 -Wunused-template"
      # Vendored third-party headers are checked upstream and are not maintained
      # according to MQT Core's clang-tidy configuration.
      cpp-linter-ignore-extra: "vendor/**"
    permissions:
      contents: read
      pull-requests: write # Needed to post review comments

  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}
      sessions: ${{ matrix.runs-on == 'ubuntu-26.04' && '["minimums", "tests", "qiskit-compat", "catalyst"]' || '["minimums", "tests"]' }}
    permissions:
      contents: read

  python-coverage:
    name: 🐍 Coverage
    needs: [change-detection, python-tests]
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    permissions:
      contents: read
      id-token: write # Authenticate coverage uploads with Codecov

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      check-stubs: true
      enable-ty: true
      enable-mypy: false
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    permissions:
      contents: read

  build-sdist:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    permissions:
      contents: read

  build-wheel:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          [
            ubuntu-26.04,
            ubuntu-26.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ${{ matrix.runs-on }}
      use-sccache-gha: true
    permissions:
      contents: read

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - docs
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-coverage
      - cpp-linter
      - python-tests
      - python-coverage
      - python-linter
      - build-sdist
      - build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{ !fromJSON(needs.change-detection.outputs.run-docs) && 'docs,' || '' }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-sdist,build-wheel' || ''
            }}
          jobs: ${{ toJSON(needs) }}
