name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      additional-python-files: "mlir/**"
    permissions:
      contents: read

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            compiler: gcc
            preset: debug
            run-on-draft: true
            setup-mlir: true
          - runs-on: ubuntu-24.04
            compiler: gcc
            preset: release-no-mlir
            run-on-draft: true
            setup-mlir: false
          - runs-on: ubuntu-24.04-arm
            compiler: gcc
            preset: release
            run-on-draft: false
            setup-mlir: true
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      setup-mlir: ${{ matrix.setup-mlir }}
      llvm-version: 23.1.0
      preset-name: ${{ matrix.preset }}
      run-on-draft: ${{ matrix.run-on-draft }}
    permissions:
      contents: read

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-26
            compiler: clang
            preset: debug
            run-on-draft: true
          - runs-on: macos-26
            compiler: clang
            preset: release
            run-on-draft: false
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      setup-mlir: true
      llvm-version: 23.1.0
      preset-name: ${{ matrix.preset }}
      run-on-draft: ${{ matrix.run-on-draft }}
    permissions:
      contents: read

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2025
            compiler: msvc
            preset: release-windows
            run-on-draft: true
          - runs-on: windows-11-arm
            compiler: msvc
            preset: release-windows
            run-on-draft: false
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      setup-mlir: true
      llvm-version: 23.1.0
      preset-name: ${{ matrix.preset }}
      run-on-draft: ${{ matrix.run-on-draft }}
    permissions:
      contents: read

  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-coverage.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      setup-mlir: true
      llvm-version: 23.1.0
    permissions:
      contents: read
      id-token: write

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    # Temporary canary for munich-quantum-toolkit/workflows#448.
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@c032cc32bc19f970118e0f6d3c57e86e6e683beb
    with:
      clang-version: 23
      build-project: true
      files-changed-only: false
      setup-python: true
      install-pkgs: "nanobind==3.0.1"
      cpp-linter-extra-args: "-std=c++20 -Wunused-template"
      # Vendored third-party headers are checked upstream and are not maintained
      # according to MQT Core's clang-tidy configuration.
      cpp-linter-ignore-extra: "vendor/**"
      setup-mlir: true
      llvm-version: 23.1.0
    permissions:
      contents: read
      pull-requests: write # Needed to post review comments

  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-mlir: true
      llvm-version: 23.1.0
    permissions:
      contents: read

  python-coverage:
    name: 🐍 Coverage
    needs: [change-detection, python-tests]
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    permissions:
      contents: read
      id-token: write

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      check-stubs: true
      enable-ty: true
      enable-mypy: false
      setup-mlir: true
      llvm-version: 23.1.0
    permissions:
      contents: read

  build-sdist:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    permissions:
      contents: read

  build-wheel:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@063c90c8e7e094bfffb73f8436eb55341c1e820f # v2.3.0
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-mlir: true
      llvm-version: 23.1.0
    permissions:
      contents: read

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-coverage
      - cpp-linter
      - python-tests
      - python-linter
      - build-sdist
      - build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-sdist,build-wheel' || ''
            }}
          jobs: ${{ toJSON(needs) }}
