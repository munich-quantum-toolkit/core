name: Qiskit Upstream Tests
on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  pull_request:
    paths:
      - ".github/workflows/upstream.yml"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  qiskit-upstream-tests:
    name: 🐍⚛️
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, macos-15, windows-2025]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-qiskit-upstream-tests.yml@f29527fbf2ea6ee400af2853bcf6e1aa7fc63c2b # v2.5.8
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-z3: true
    permissions:
      contents: read

  create-issue-on-failure:
    name: Create issue on failure
    needs: qiskit-upstream-tests
    if: ${{ always() }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-upstream-issue.yml@f29527fbf2ea6ee400af2853bcf6e1aa7fc63c2b # v2.5.8
    with:
      tests-result: ${{ needs.qiskit-upstream-tests.result }}
      name: Qiskit
      upstream-repository: Qiskit/qiskit
    permissions:
      issues: write # Needed to create/update issues
