name: Upstream Tests
on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  pull_request:
    paths:
      - ".github/workflows/upstream.yml"
      - "scripts/catalyst_abi_check.py"
      - "test/python/test_catalyst_abi_check.py"
      - "vendor/catalyst/**"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  catalyst-abi-check:
    name: Catalyst device ABI
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --no-project --with 'pytest>=9.0.1' pytest -o addopts= -q -m catalyst_abi test/python/test_catalyst_abi_check.py
      - run: uv run scripts/catalyst_abi_check.py

  catalyst-upstream-tests:
    name: 🐍⚛️ Catalyst development
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ubuntu-26.04
      sessions: '["catalyst-dev"]'
      draft-sessions: '["catalyst-dev"]'
      setup-mlir: true
      llvm-version: 23.1.4
    permissions:
      contents: read

  qiskit-upstream-tests:
    name: 🐍⚛️
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, macos-15, windows-2025]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-qiskit-upstream-tests.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-z3: true
      setup-mlir: true
      llvm-version: 23.1.4
    permissions:
      contents: read

  report-qiskit-failure:
    name: Report Qiskit failure
    needs: qiskit-upstream-tests
    if: ${{ always() }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-upstream-issue.yml@f29527fbf2ea6ee400af2853bcf6e1aa7fc63c2b # v2.5.8
    with:
      tests-result: ${{ needs.qiskit-upstream-tests.result }}
      name: Qiskit
      upstream-repository: Qiskit/qiskit
    permissions:
      issues: write # Needed to create/update issues

  report-catalyst-failure:
    name: Report Catalyst failure
    needs: [catalyst-upstream-tests, catalyst-abi-check]
    if: ${{ always() }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-upstream-issue.yml@f29527fbf2ea6ee400af2853bcf6e1aa7fc63c2b # v2.5.8
    with:
      tests-result: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
      name: Catalyst
      upstream-repository: PennyLaneAI/catalyst
    permissions:
      issues: write # Needed to create/update issues
