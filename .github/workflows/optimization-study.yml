name: Portable SDK optimization study

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Build library variants or Core wheels"
        type: choice
        options: [sdk, wheel]
        default: sdk
      sdk-run-id:
        description: "Native SDK workflow run in portable-mlir-toolchain"
        type: string
        default: "34411299839"
      libraries-run-id:
        description: "SDK variant study run in Core; required for wheel stage"
        type: string
        default: ""
      pgo:
        description: "Compiler profile scope for wheel stage"
        type: choice
        options: [none, core, both]
        default: none
      recipes:
        description: "SDK/Core LTO pairs to measure"
        type: string
        default: '[{"sdk":"OFF","core":"OFF"},{"sdk":"OFF","core":"Thin"},{"sdk":"OFF","core":"Full"},{"sdk":"Thin","core":"Thin"},{"sdk":"Thin","core":"Full"},{"sdk":"Full","core":"Full"}]'
  push:
    branches: [codex/linux-optimization-experiments]
    paths: [.github/workflows/optimization-study.yml]

permissions:
  contents: read
  actions: read

jobs:
  libraries:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'sdk') ||
      github.event_name == 'push'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lto: [OFF, Thin, Full]
        platform:
          - {
              name: linux-arm64,
              runner: ubuntu-24.04-arm,
              arch: aarch64,
              triple: aarch64-unknown-linux-gnu,
              jobs: 4,
            }
          - {
              name: linux-x64,
              runner: ubuntu-24.04,
              arch: x86_64,
              triple: x86_64-unknown-linux-gnu,
              jobs: 4,
            }
          - {
              name: macos-arm64,
              runner: macos-26,
              arch: arm64,
              triple: arm64-apple-darwin,
              jobs: 3,
            }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-software/portable-mlir-toolchain
          ref: 37aba3026628023e29112748c110804abe3c5f89
          path: toolchain
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: munich-quantum-software/portable-mlir-toolchain
          run-id: ${{ inputs.sdk-run-id || '34411299839' }}
          github-token: ${{ github.token }}
          name: llvm-mlir_llvmorg-23.1.0_${{ matrix.platform.triple }}_noassert.tar.zst
          path: ${{ runner.temp }}/study/download
          skip-decompress: true
      - name: Build SDK libraries
        shell: bash
        env:
          STUDY_ROOT: ${{ runner.temp }}/study
          STUDY_OPERATION: sdk
          STUDY_SDK_LTO: ${{ matrix.lto }}
          STUDY_JOBS: ${{ matrix.platform.jobs }}
          STUDY_ARCH: ${{ matrix.platform.arch }}
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 scripts/linux_optimization.py --output "$STUDY_ROOT/pipeline.json" \
              --container mqt-study -- docker run --rm --name mqt-study --cpus=4 --memory=16g --memory-swap=16g \
              -v "$GITHUB_WORKSPACE:/project" -v "$STUDY_ROOT:/study" \
              -e STUDY_ROOT=/study -e STUDY_OPERATION -e STUDY_SDK_LTO -e STUDY_JOBS \
              "quay.io/pypa/manylinux_2_28_${STUDY_ARCH}:2026.08.04-1" \
              bash /project/test/release/run_study.sh
          else
            python3 scripts/linux_optimization.py --output "$STUDY_ROOT/pipeline.json" -- bash test/release/run_study.sh
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: study-sdk-${{ matrix.platform.name }}-${{ matrix.lto }}
          path: |
            ${{ runner.temp }}/study/output/sdk.tar.zst
            ${{ runner.temp }}/study/output/sdk-artifact.json
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-sdk-records-${{ matrix.platform.name }}-${{ matrix.lto }}
          path: |
            ${{ runner.temp }}/study/output/measurements
            ${{ runner.temp }}/study/output/sdk-build/variant-*.json
            ${{ runner.temp }}/study/source.sha256
            ${{ runner.temp }}/study/xcode.txt
            ${{ runner.temp }}/study/pipeline.*
          if-no-files-found: error

  wheels:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'wheel'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        recipe: ${{ fromJSON(inputs.recipes) }}
        platform:
          - {
              name: linux-arm64,
              runner: ubuntu-24.04-arm,
              arch: aarch64,
              jobs: 4,
            }
          - { name: linux-x64, runner: ubuntu-24.04, arch: x86_64, jobs: 4 }
          - { name: macos-arm64, runner: macos-26, arch: arm64, jobs: 3 }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-software/portable-mlir-toolchain
          ref: 37aba3026628023e29112748c110804abe3c5f89
          path: toolchain
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.libraries-run-id }}
          github-token: ${{ github.token }}
          name: study-sdk-${{ matrix.platform.name }}-${{ matrix.recipe.sdk }}
          path: ${{ runner.temp }}/study/download
      - name: Build and validate Core wheels
        shell: bash
        env:
          STUDY_ROOT: ${{ runner.temp }}/study
          STUDY_OPERATION: wheel
          STUDY_SDK_LTO: ${{ matrix.recipe.sdk }}
          STUDY_CORE_LTO: ${{ matrix.recipe.core }}
          STUDY_PGO: ${{ inputs.pgo }}
          STUDY_JOBS: ${{ matrix.platform.jobs }}
          STUDY_ARCH: ${{ matrix.platform.arch }}
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 scripts/linux_optimization.py --output "$STUDY_ROOT/pipeline.json" \
              --container mqt-study -- docker run --rm --name mqt-study --cpus=4 --memory=16g --memory-swap=16g \
              -v "$GITHUB_WORKSPACE:/project" -v "$STUDY_ROOT:/study" \
              -e STUDY_ROOT=/study -e STUDY_OPERATION -e STUDY_SDK_LTO -e STUDY_CORE_LTO \
              -e STUDY_PGO -e STUDY_JOBS \
              "quay.io/pypa/manylinux_2_28_${STUDY_ARCH}:2026.08.04-1" \
              bash /project/test/release/run_study.sh
          else
            python3 scripts/linux_optimization.py --output "$STUDY_ROOT/pipeline.json" -- bash test/release/run_study.sh
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: study-wheels-${{ matrix.platform.name }}-${{ matrix.recipe.sdk }}-${{ matrix.recipe.core }}-${{ inputs.pgo }}
          path: |
            ${{ runner.temp }}/study/output/artifacts
            ${{ runner.temp }}/study/output/artifacts.json
            ${{ runner.temp }}/study/output/requirements.txt
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-wheel-records-${{ matrix.platform.name }}-${{ matrix.recipe.sdk }}-${{ matrix.recipe.core }}-${{ inputs.pgo }}
          path: |
            ${{ runner.temp }}/study/output/measurements
            ${{ runner.temp }}/study/output/inputs.json
            ${{ runner.temp }}/study/output/sdk-build/variant-*.json
            ${{ runner.temp }}/study/source.sha256
            ${{ runner.temp }}/study/xcode.txt
            ${{ runner.temp }}/study/pipeline.*
          if-no-files-found: error
