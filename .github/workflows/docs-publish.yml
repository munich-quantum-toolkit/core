name: Publish documentation
on:
  # The shared publisher handles static artifacts without executing PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Documentation]
    types: [completed]

permissions: {}

jobs:
  publish:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-docs-publish.yml@b42258dee22ee531b6de45cd40f8129b2353595f # workflows PR #522
    with:
      project-slug: mqt-core
      build-workflows: |
        .github/workflows/ci.yml
        .github/workflows/docs.yml
    secrets:
      READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
