name: Publish documentation
on:
  # The shared publisher handles static artifacts without executing PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Documentation]
    types: [completed]

permissions: {}

jobs:
  publish:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-docs-publish.yml@d57d0543d16a0ac025f1f62cdbb822ca31ea2c2f # workflows PR #522
    with:
      project-slug: mqt-core
      build-workflows: |
        .github/workflows/ci.yml
        .github/workflows/docs.yml
    secrets:
      READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
