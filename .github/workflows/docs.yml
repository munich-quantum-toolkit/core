name: Documentation
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  docs:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-docs.yml@186f7987e940652c4284c63314569a6b3e4587d3 # zizmor: ignore[stale-action-refs]
    with:
      apt-packages: doxygen
    permissions:
      actions: read # Shared publisher downloads docs artifacts
      contents: read
      pull-requests: read # Shared publisher verifies preview commits
