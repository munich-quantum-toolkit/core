name: Documentation
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  docs:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-docs.yml@b2b736dc2b5e2cc870d1456f825eaa5642a3a296 # zizmor: ignore[stale-action-refs]
    with:
      apt-packages: doxygen
    permissions:
      actions: read # Shared publisher downloads docs artifacts
      contents: read
      pull-requests: read # Shared publisher verifies preview commits
