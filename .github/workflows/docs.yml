name: Documentation
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and validate documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # GitHub scopes PR caches to their merge ref; main cannot restore them.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # zizmor: ignore[cache-poisoning]
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install native documentation tools
        run: sudo apt-get update && sudo apt-get install --yes ccache doxygen
      - name: Set up LLVM/MLIR
        uses: munich-quantum-software/setup-mlir@246aa0c70414109aa55fa19a5370739519833512
        with:
          llvm-version: 23.1.4
          assertions: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # zizmor: ignore[cache-poisoning]
        with:
          path: .ccache
          key: docs-${{ runner.os }}-${{ runner.arch }}-llvm23.1.4-${{ github.sha }}
          restore-keys: docs-${{ runner.os }}-${{ runner.arch }}-llvm23.1.4-
      - name: Test documentation tooling
        run: >-
          uv run --no-project --with 'pytest>=9.0.1' python -m pytest
          -o addopts= -q test/docs test/python/test_docs_links.py
      - name: Build and validate all documentation
        run: |
          ccache --zero-stats
          /usr/bin/time -f 'Documentation wall time: %e s; peak RSS: %M KiB' uvx nox --non-interactive -s docs
          ccache --show-stats
      - name: Package the validated site
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          mkdir -p build/docs-artifact
          cp -R docs/_build/html build/docs-artifact/html
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          manifest = {"commit": commit, "pull_request": int(os.environ["PR_NUMBER"] or 0), "ref": os.environ["SOURCE_REF"]}
          Path("build/docs-artifact/manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          shutil.make_archive("build/docs-artifact/html", "zip", "docs/_build/html")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/docs-artifact
          if-no-files-found: error
          retention-days: 30
