name: Documentation
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  docs:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-docs.yml@85eef7c1358086e8669ceda13b27d1a9caf095c1 # zizmor: ignore[stale-action-refs]
    with:
      apt-packages: doxygen
    permissions:
      actions: read # Shared publisher downloads docs artifacts
      contents: read
      pull-requests: read # Shared publisher verifies preview commits
