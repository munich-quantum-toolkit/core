name: Documentation
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  docs:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-docs.yml@5111762228d11d2d44dead3362a7bd3fcc174efe # zizmor: ignore[stale-action-refs]
    with:
      apt-packages: doxygen
    permissions:
      actions: read # Shared publisher downloads docs artifacts
      contents: read
      pull-requests: read # Shared publisher verifies preview commits
