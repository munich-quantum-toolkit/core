ignore:
  - "**/python"
  - "test/**/*"
  - "mlir/unittests/**/*"

coverage:
  range: 60..90
  precision: 1
  status:
    project:
      default:
        target: 90%
        threshold: 1%
        removed_code_behavior: adjust_base
    patch:
      default:
        target: 90%
        informational: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: cpp
      paths:
        - "include"
        - "src"
        - "mlir"
    - name: python
      paths:
        - "python/mqt/**/*.py"

parsers:
  gcov:
    branch_detection:
      conditional: no
      loop: no

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
  show_carryforward_flags: true
